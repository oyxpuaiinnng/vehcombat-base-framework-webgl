<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>VeCombat</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #101214; }
      /* 内部渲染固定 1920×1080（默认模板 960×600 的两倍），CSS 等比铺满窗口，避免把画面拉伸变形。 */
      #unity-canvas {
        display: block; width: 100vw; height: 100vh; object-fit: contain;
        background: #101214; outline: none;
      }
      #unity-loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; color: #cfd6e4; font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 14px;
      }
      #unity-progress { width: 260px; height: 6px; background: #243043; border-radius: 3px; overflow: hidden; }
      #unity-progress-fill { height: 100%; width: 0; background: #5b8def; transition: width .15s linear; }
      #unity-warning {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%); max-width: 80vw;
        background: #3a1a1a; color: #ffd7d7; padding: 8px 12px; border-radius: 4px; display: none;
        font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; white-space: pre-wrap;
      }
      #unity-fullscreen {
        position: fixed; right: 10px; bottom: 10px; width: 34px; height: 34px; border: 0; border-radius: 5px;
        background: rgba(40, 50, 70, .72); color: #dfe6f5; cursor: pointer; font-size: 16px; line-height: 34px;
      }
      #unity-fullscreen:hover { background: rgba(70, 90, 130, .85); }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div>VeCombat 加载中…</div>
      <div id="unity-progress"><div id="unity-progress-fill"></div></div>
    </div>
    <div id="unity-warning"></div>
    <button id="unity-fullscreen" title="全屏 / 退出全屏">⛶</button>
    <script>
      // ★ 2026-11-20：自定义 WebGL 模板。
      //   ① 渲染分辨率固定 1920×1080（Unity 默认模板是 960×600，高分屏上明显模糊）；
      //   ② 画布用 CSS 等比铺满窗口（object-fit: contain），保持 16:9 不变形；
      //   ③ matchWebGLToCanvasSize=false —— 不让 Unity 用窗口尺寸覆盖 1920×1080 的渲染目标。
      //   构建脚本固定输出 Build/out.* 这套文件名，因此这里直接写死；改名要同步改这里。
      var canvas = document.querySelector("#unity-canvas");
      var warningBox = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        warningBox.textContent = msg;
        warningBox.style.background = type === 'error' ? '#3a1a1a' : '#3a331a';
        warningBox.style.color = type === 'error' ? '#ffd7d7' : '#ffe9a8';
        warningBox.style.display = 'block';
        if (type !== 'error') { setTimeout(function () { warningBox.style.display = 'none'; }, 6000); }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/out.data.unityweb",
        frameworkUrl: buildUrl + "/out.framework.js.unityweb",
        codeUrl: buildUrl + "/out.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "VeCombat_Demo",
        productVersion: "0.2.0",
        matchWebGLToCanvasSize: false,
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading").style.display = "flex";

      var script = document.createElement("script");
      script.src = buildUrl + "/out.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-fill").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading").style.display = "none";
          document.querySelector("#unity-fullscreen").onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          unityShowBanner(String(message), 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
